<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>台股選股追蹤</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#08111f;color:#edf3ff}.wrap{max-width:820px;margin:auto;padding:14px 14px 92px}.hero{padding:12px 2px}.hero h1{font-size:27px;margin:0 0 5px}.muted,.hint{color:#8fa0b8;font-size:12px}.card{background:#111c2e;border:1px solid #22304a;border-radius:18px;padding:15px;margin:11px 0}h2{font-size:18px;margin:0 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;color:#a9b7cc;display:block;margin-bottom:5px}input,select{width:100%;background:#0a1424;color:#fff;border:1px solid #30415d;border-radius:11px;padding:11px;font-size:15px}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;background:#2563eb;color:#fff}.secondary{background:#24334d}.danger{background:#7f1d1d}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}.actions{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:12px}.stock{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #26344b}.ticker{font-weight:800;font-size:17px}.name{color:#a8b5c8;font-size:13px}.up{color:#fb7185}.down{color:#5eead4}.tag{font-size:11px;background:#20304a;border-radius:999px;padding:4px 7px;color:#cbd5e1;display:inline-block;margin:4px 3px 0 0}.empty{text-align:center;color:#7f91ab;padding:20px 0}.status{padding:9px 11px;border-radius:10px;background:#0a1424;margin-top:10px;font-size:12px;color:#a8b5c8}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0c1728ee;backdrop-filter:blur(12px);border-top:1px solid #26344b;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.tabs button{background:transparent;color:#91a2ba;max-width:260px;width:50%;border-radius:0}.tabs button.active{color:#fff;border-top:2px solid #60a5fa}.hidden{display:none}.count{font-size:12px;color:#93c5fd;margin-left:6px}@media(max-width:430px){.wrap{padding-top:7px}}</style></head><body><div class="wrap">
<div class="hero"><h1>台股選股追蹤</h1><div class="muted">V2｜上市盤後行情・條件選股・自選追蹤</div></div>
<section id="screenFilter"><div class="card"><h2>選股條件</h2><div class="grid">
<div><label>股價最低</label><input id="minPrice" type="number" placeholder="不限"></div><div><label>股價最高</label><input id="maxPrice" type="number" placeholder="不限"></div>
<div><label>單日漲幅 ≥ %</label><input id="minChange" type="number" step=".1" placeholder="例如 2"></div><div><label>成交量 ≥ 張</label><input id="minVolume" type="number" placeholder="例如 1000"></div>
<div><label>量比 ≥（下一版）</label><input id="volumeRatio" type="number" step=".1" placeholder="暫不套用" disabled></div><div><label>排序</label><select id="sort"><option value="change">漲幅高→低</option><option value="volume">成交量高→低</option><option value="price">股價高→低</option></select></div></div>
<div class="actions"><button onclick="scan()">開始選股</button><button class="secondary" onclick="resetFilter()">清除</button></div><div id="status" class="status">準備就緒。資料來源：臺灣證券交易所 OpenAPI（上市）。</div></div>
<div class="card"><h2>篩選結果 <span id="count" class="count"></span></h2><div id="results" class="empty">按「開始選股」載入最新盤後資料</div></div></section>
<section id="screenWatch" class="hidden"><div class="card"><h2>加入追蹤</h2><div class="row"><input id="symbol" inputmode="numeric" placeholder="股票代號，例如 6213"><button onclick="addStock()">加入</button></div></div><div class="card"><h2>我的追蹤清單</h2><div id="watchlist"></div></div></section></div>
<div class="tabs"><button id="tabFilter" class="active" onclick="showTab('filter')">選股</button><button id="tabWatch" onclick="showTab('watch')">追蹤</button></div>
<script>
const API='https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';const FIELDS=['minPrice','maxPrice','minChange','minVolume','sort'];let market=[];
const n=v=>{const x=parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(x)?x:0};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function saveFilter(){let x={};FIELDS.forEach(k=>x[k]=document.getElementById(k).value);localStorage.setItem('twFilter',JSON.stringify(x))}
function loadFilter(){let x=JSON.parse(localStorage.getItem('twFilter')||'{}');FIELDS.forEach(k=>{if(x[k]!=null)document.getElementById(k).value=x[k]})}
function resetFilter(){FIELDS.forEach(k=>document.getElementById(k).value='');document.getElementById('sort').value='change';localStorage.removeItem('twFilter');document.getElementById('results').innerHTML='<div class="empty">條件已清除</div>';document.getElementById('count').textContent=''}
function normalize(r){let price=n(r.ClosingPrice),chg=n(r.Change),prev=price-chg,pct=prev?chg/prev*100:0;return {symbol:r.Code,name:r.Name,price,chg,pct,volume:n(r.TradeVolume)/1000,open:n(r.OpeningPrice),high:n(r.HighestPrice),low:n(r.LowestPrice)}}
async function scan(){saveFilter();let st=document.getElementById('status');st.textContent='正在讀取臺灣證券交易所最新資料…';try{let res=await fetch(API,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);market=(await res.json()).map(normalize).filter(x=>/^\d{4}$/.test(x.symbol)&&x.price>0);apply();st.textContent='載入成功：'+market.length+' 檔上市股票／證券。更新時間依交易所最新盤後資料。'}catch(e){st.textContent='資料讀取失敗：'+e.message+'。請稍後再試。';document.getElementById('results').innerHTML='<div class="empty">目前無法取得行情資料</div>'}}
function apply(){let minP=n(document.getElementById('minPrice').value),maxP=n(document.getElementById('maxPrice').value),minC=document.getElementById('minChange').value,minV=n(document.getElementById('minVolume').value),sort=document.getElementById('sort').value;minC=minC===''?-Infinity:n(minC);let a=market.filter(x=>(!minP||x.price>=minP)&&(!maxP||x.price<=maxP)&&x.pct>=minC&&(!minV||x.volume>=minV));a.sort((a,b)=>sort==='volume'?b.volume-a.volume:sort==='price'?b.price-a.price:b.pct-a.pct);document.getElementById('count').textContent=a.length+' 檔';let el=document.getElementById('results');if(!a.length){el.innerHTML='<div class="empty">沒有符合目前條件的股票</div>';return}el.innerHTML=a.slice(0,200).map(x=>'<div class="stock"><div><div class="ticker">'+esc(x.symbol)+' '+esc(x.name)+'</div><div class="name">收 '+x.price.toFixed(2)+'｜量 '+Math.round(x.volume).toLocaleString()+' 張｜高 '+x.high.toFixed(2)+'｜低 '+x.low.toFixed(2)+'</div><span class="tag '+(x.pct>=0?'up':'down')+'">'+(x.pct>=0?'+':'')+x.pct.toFixed(2)+'%</span></div><button onclick="quickAdd(\''+x.symbol+'\')">＋追蹤</button></div>').join('')}
function list(){return JSON.parse(localStorage.getItem('twWatch')||'[]')}function quickAdd(s){let a=list();if(!a.includes(s))a.push(s);localStorage.setItem('twWatch',JSON.stringify(a));render();alert(s+' 已加入追蹤')}
function addStock(){let el=document.getElementById('symbol'),s=el.value.trim();if(!/^\d{4,6}$/.test(s)){alert('請輸入正確股票代號');return}quickAdd(s);el.value=''}
function removeStock(s){localStorage.setItem('twWatch',JSON.stringify(list().filter(x=>x!==s)));render()}
function render(){let a=list(),el=document.getElementById('watchlist');if(!a.length){el.innerHTML='<div class="empty">尚未加入股票</div>';return}el.innerHTML=a.map(s=>{let x=market.find(z=>z.symbol===s);return '<div class="stock"><div><div class="ticker">'+esc(s)+(x?' '+esc(x.name):'')+'</div><div class="name">'+(x?('收 '+x.price.toFixed(2)+'｜'+(x.pct>=0?'+':'')+x.pct.toFixed(2)+'%'):'執行一次選股後顯示行情')+'</div><span class="tag">追蹤中</span></div><button class="danger" onclick="removeStock(\''+s+'\')">刪除</button></div>'}).join('')}
function showTab(t){document.getElementById('screenFilter').classList.toggle('hidden',t!=='filter');document.getElementById('screenWatch').classList.toggle('hidden',t!=='watch');document.getElementById('tabFilter').classList.toggle('active',t==='filter');document.getElementById('tabWatch').classList.toggle('active',t==='watch');if(t==='watch')render()}
loadFilter();render();</script></body></html>
