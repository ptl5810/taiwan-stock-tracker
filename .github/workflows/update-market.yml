name: Update market data
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TWSE market data
        run: |
          mkdir -p data
          python - <<'PY'
          import json, urllib.request, datetime
          url='https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r:
              rows=json.load(r)
          out={'updated_at':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).isoformat(),'source':'TWSE STOCK_DAY_ALL','rows':rows}
          with open('data/market.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print('rows',len(rows))
          PY
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push
