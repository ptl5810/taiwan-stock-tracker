name: Update market data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market.yml'
  schedule:
    - cron: '20 6 * * 1-5'
permissions:
  contents: write
concurrency:
  group: market-data-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch TWSE snapshot and revenue
        run: |
          mkdir -p data
          python - <<'PY'
          import json, urllib.request, datetime, os
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=60) as r:
                  return json.load(r)
          rows=get('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL')
          rev=get('https://openapi.twse.com.tw/v1/opendata/t187ap05_L')
          revmap={str(x.get('公司代號','')).strip():x for x in rev}
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          day=now.strftime('%Y-%m-%d')
          os.makedirs('data/history',exist_ok=True)
          snap={}
          for r in rows:
              code=str(r.get('Code','')).strip()
              if not (len(code)==4 and code.isdigit()): continue
              rv=revmap.get(code,{})
              r['RevenueYoY']=rv.get('營業收入-去年同月增減(%)','0') or '0'
              r['RevenueMoM']=rv.get('營業收入-上月比較增減(%)','0') or '0'
              r['RevenueMonth']=rv.get('資料年月','')
              snap[code]={
                'close':r.get('ClosingPrice','0'),'high':r.get('HighestPrice','0'),
                'low':r.get('LowestPrice','0'),'volume':r.get('TradeVolume','0')
              }
          hp='data/history/daily.json'
          try:
              hist=json.load(open(hp,encoding='utf-8'))
          except Exception:
              hist={}
          hist[day]=snap
          # retain 100 calendar snapshots
          hist=dict(sorted(hist.items())[-100:])
          with open(hp,'w',encoding='utf-8') as fp:
              json.dump(hist,fp,ensure_ascii=False,separators=(',',':'))
          def num(v):
              try:return float(str(v).replace(',',''))
              except:return 0.0
          days=sorted(hist)
          for r in rows:
              code=str(r.get('Code','')).strip()
              if not (len(code)==4 and code.isdigit()): continue
              series=[hist[d][code] for d in days if code in hist[d]]
              closes=[num(x['close']) for x in series if num(x['close'])>0]
              vols=[num(x['volume']) for x in series if num(x['volume'])>0]
              cur=num(r.get('TradeVolume'))
              prior=vols[:-1][-5:]
              r['VolumeRatio']=str(cur/(sum(prior)/len(prior))) if prior and sum(prior)>0 else '0'
              r['MA20']=str(sum(closes[-20:])/20) if len(closes)>=20 else '0'
              r['MA60']=str(sum(closes[-60:])/60) if len(closes)>=60 else '0'
              r['High20']='1' if len(closes)>=20 and closes[-1]>=max(closes[-20:]) else '0'
              if len(closes)>=15:
                  gains=[]; losses=[]
                  for a,b in zip(closes[-15:-1],closes[-14:]):
                      ch=b-a; gains.append(max(ch,0)); losses.append(max(-ch,0))
                  ag=sum(gains)/14; al=sum(losses)/14
                  r['RSI14']=str(100 if al==0 else 100-(100/(1+ag/al)))
              else:r['RSI14']='0'
              # placeholders are explicit until enough accumulated history exists
              r.setdefault('GrossMargin','0'); r.setdefault('GrossMarginIncrease','0')
              r.setdefault('RevenueHighMonths','0')
          out={'updated_at':now.isoformat(),'source':'TWSE official snapshot + monthly revenue; indicators from accumulated snapshots','history_days':len(days),'rows':rows}
          with open('data/market.json','w',encoding='utf-8') as fp:
              json.dump(out,fp,ensure_ascii=False,separators=(',',':'))
          print('rows',len(rows),'history_days',len(days))
          PY
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/history/daily.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update market data"
          git pull --rebase origin main
          git push origin main
