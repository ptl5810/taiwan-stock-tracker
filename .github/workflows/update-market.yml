name: Update market data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market.yml'
  schedule:
    - cron: '20 6 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TWSE market data
        run: |
          mkdir -p data
          python - <<'PY'
          import json, urllib.request, datetime, time, re, io
          url='https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r:
              rows=json.load(r)
          if not rows: raise RuntimeError('TWSE returned no rows')
          # Latest official monthly revenue snapshot.
          rev_url='https://openapi.twse.com.tw/v1/opendata/t187ap05_L'
          rev_req=urllib.request.Request(rev_url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          with urllib.request.urlopen(rev_req,timeout=60) as rr:
              rev_rows=json.load(rr)
          rev_map={str(x.get('公司代號','')).strip():x for x in rev_rows}
          for row in rows:
              rv=rev_map.get(str(row.get('Code','')).strip(),{})
              row['RevenueYoY']=rv.get('營業收入-去年同月增減(%)','0') or '0'
              row['RevenueMoM']=rv.get('營業收入-上月比較增減(%)','0') or '0'
              row['RevenueMonth']=rv.get('資料年月','')
              row['RevenueCurrent']=rv.get('營業收入-當月營收','0') or '0'
              row['RevenueHighMonths']='0'
          # Volume ratio = latest trading-day volume / average volume of the prior 5 trading days.
          # Fetch recent daily history for 4-digit listed stocks; fall back to 0 if history is unavailable.
          today=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          yyyymmdd=today.strftime('%Y%m%d')
          for i,row in enumerate(rows):
              code=str(row.get('Code',''))
              row['VolumeRatio']='0'
              if not (len(code)==4 and code.isdigit()): continue
              try:
                  hurl=f'https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date={yyyymmdd}&stockNo={code}'
                  hreq=urllib.request.Request(hurl,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                  with urllib.request.urlopen(hreq,timeout=20) as hr:
                      hist=json.load(hr)
                  data=hist.get('data') or []
                  vols=[]
                  for x in data:
                      try: vols.append(float(str(x[1]).replace(',','')))
                      except: pass
                  current=float(str(row.get('TradeVolume','0')).replace(',','') or 0)
                  prior=vols[:-1][-5:] if len(vols)>1 else []
                  if prior and sum(prior)>0:
                      row['VolumeRatio']=str(current/(sum(prior)/len(prior)))
              except Exception:
                  pass
              if i%100==0: print('history',i,'/',len(rows))
              time.sleep(0.03)
          # Build revenue-high history from official MOPS archive (up to 36 months).
          try:
              import pandas as pd
              def prev_month(y,m):
                  m-=1
                  if m==0: y,m=y-1,12
                  return y,m
              periods=[]
              sample=next((x.get('資料年月','') for x in rev_rows if x.get('資料年月')), '')
              if sample and len(sample)>=5:
                  ry=int(sample[:-2]); rm=int(sample[-2:])
                  for _ in range(36):
                      periods.append((ry,rm)); ry,rm=prev_month(ry,rm)
              hist={}
              for pi,(ry,rm) in enumerate(periods):
                  for suffix in (0,1):
                      url=f'https://mopsov.twse.com.tw/nas/t21/sii/t21sc03_{ry}_{rm}_{suffix}.html'
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                          raw=urllib.request.urlopen(req,timeout=45).read()
                          tables=pd.read_html(io.BytesIO(raw),encoding='big5')
                          for tb in tables:
                              tb.columns=[''.join(str(z) for z in col if str(z)!='nan') if isinstance(col,tuple) else str(col) for col in tb.columns]
                              codecol=next((x for x in tb.columns if '公司代號' in x),None)
                              revcol=next((x for x in tb.columns if '當月營收' in x and '去年' not in x),None)
                              if not codecol or not revcol: continue
                              for _,r in tb.iterrows():
                                  code=str(r.get(codecol,'')).strip()
                                  if not re.fullmatch(r'\d{4}',code): continue
                                  try: val=float(str(r.get(revcol,0)).replace(',',''))
                                  except: continue
                                  hist.setdefault(code,[]).append((pi,val))
                      except Exception as e:
                          print('revenue archive skip',ry,rm,suffix,str(e)[:80])
                  time.sleep(0.05)
              for row in rows:
                  code=str(row.get('Code',''))
                  vals=sorted(hist.get(code,[]))
                  if not vals: continue
                  current=float(str(row.get('RevenueCurrent','0')).replace(',','') or 0)
                  seq=[v for _,v in vals]
                  high=0
                  for window in (36,24,12,6,3):
                      recent=seq[:window]
                      if recent and current>=max(recent): high=max(high,window)
                  row['RevenueHighMonths']=str(high)
          except Exception as e:
              print('revenue history unavailable',repr(e))
          out={'updated_at':today.isoformat(),'source':'TWSE STOCK_DAY_ALL + STOCK_DAY + MOPS revenue','rows':rows}
          with open('data/market.json','w',encoding='utf-8') as fp:
              json.dump(out,fp,ensure_ascii=False,separators=(',',':'))
          print('rows',len(rows))
          PY
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Update market data"
          git pull --rebase origin main
          git push origin main
